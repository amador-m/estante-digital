server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota que não seja um arquivo real (ex.: /catalogo,
    # /admin, /livro/123) cai no index.html e o React Router assume a
    # partir daí. Sem isso, dar F5 numa rota diferente da raiz devolveria
    # 404 do Nginx em vez de abrir a página React correspondente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
